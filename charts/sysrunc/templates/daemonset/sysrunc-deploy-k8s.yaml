{{- $nested := eq (include "sysrunc.installMode" .) "nested" }}
{{- $action := .Values.installer.action | default "install" }}
{{- if not (has $action (list "install" "cleanup")) }}
{{- fail "installer.action must be install or cleanup" }}
{{- end }}
{{- if and $nested (eq $action "cleanup") }}
{{- fail "installer.action=cleanup is only available in host mode" }}
{{- end }}
{{- if and (eq $action "cleanup") (hasKey (.Values.nodeSelector | default dict) "sysrunc-runtime") }}
{{- fail "installer.action=cleanup cannot use a nodeSelector on the sysrunc-runtime label, which cleanup removes" }}
{{- end }}
{{- if or .Values.installer.enabled $nested }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "sysrunc.daemonSetName" . }}
  namespace: {{ include "sysrunc.namespace" . }}
  labels:
    {{- include "sysrunc.labels" . | nindent 4 }}
    app.kubernetes.io/component: installer
spec:
  selector:
    matchLabels:
      {{- include "sysrunc.selectorLabels" . | nindent 6 }}
      {{- if $nested }}
      app.kubernetes.io/component: installer
      {{- end }}
  template:
    metadata:
      {{- with .Values.installer.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sysrunc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: installer
        {{- with .Values.installer.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $nested }}
      enableServiceLinks: false
      # The daemons run in an independent node cgroup, so rolling the installer
      # image does not disconnect existing FUSE mounts.
      terminationGracePeriodSeconds: 10
      tolerations:
        - operator: Exists
      {{- end }}
      hostPID: true
      serviceAccountName: {{ include "sysrunc.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: installer
        image: {{ printf "%s:%s" .Values.installer.image.repository (.Values.installer.image.tag | default (printf "v%s" .Chart.AppVersion)) | quote }}
        imagePullPolicy: {{ .Values.installer.image.pullPolicy }}
        command: ["/opt/sysrunc/scripts/sysrunc-installer.sh", {{ $action | quote }}]
        env:
        - name: SYSRUNC_INSTALL_MODE
          value: {{ if $nested }}nested{{ else }}host{{ end }}
        {{- if not $nested }}
        - name: SYSRUNC_SNAPSHOTTER_ENABLED
          value: {{ .Values.snapshotter.enabled | quote }}
        - name: SYSRUNC_ADMISSION_ENABLED
          value: {{ .Values.admission.enabled | quote }}
        - name: SYSRUNC_ADMISSION_NAMESPACE
          value: {{ include "sysrunc.namespace" . | quote }}
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        {{- end }}
        securityContext:
          privileged: true
        {{- if $nested }}
        readinessProbe:
          exec:
            command: ["/opt/sysrunc/scripts/sysrunc-installer.sh", "status"]
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 6
        {{- else if eq $action "cleanup" }}
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "test -f /tmp/sysrunc-cleanup-complete && ! test -e /host/usr/bin/sysrunc && ! test -f /host/var/lib/sysrunc-deploy-k8s/sysrunc_installed"]
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 120
        {{- end }}
        volumeMounts:
        - name: host
          mountPath: /host
        {{- if $nested }}
        - name: dev-fuse
          mountPath: /dev/fuse
        {{- end }}
      volumes:
        - name: host
          hostPath:
            path: /
            type: Directory
        {{- if $nested }}
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
        {{- end }}
  {{- if not $nested }}
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  {{- end }}
{{- end }}
