{{- if eq (include "sysrunc.installMode" .) "nested" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sysrunc.fullname" . }}-inner-uninstall
  namespace: {{ include "sysrunc.namespace" . }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      hostPID: true
      serviceAccountName: {{ include "sysrunc.serviceAccountName" . }}
      containers:
        - name: uninstall
          image: {{ printf "%s:%s" .Values.installer.image.repository (.Values.installer.image.tag | default (printf "v%s" .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.installer.image.pullPolicy }}
          env:
            - name: SYSRUNC_INSTALL_MODE
              value: nested
          command:
            - /bin/sh
            - -ec
            - |
              if kubectl get pods -A -o json | jq -e '[.items[] | select(.spec.runtimeClassName == "sysrunc" and .status.phase != "Succeeded" and .status.phase != "Failed")] | length > 0' >/dev/null; then
                echo 'remove sysrunc Pods before uninstalling the nested runtime' >&2
                exit 1
              fi
              kubectl -n {{ include "sysrunc.namespace" . }} delete daemonset {{ include "sysrunc.daemonSetName" . }} {{ include "sysrunc.fullname" . }}-inner-agent --ignore-not-found --wait=true
              exec /opt/sysrunc/scripts/sysrunc-installer.sh uninstall
          securityContext:
            privileged: true
          volumeMounts:
            - name: host
              mountPath: /host
            - name: dev-fuse
              mountPath: /dev/fuse
      volumes:
        - name: host
          hostPath:
            path: /
            type: Directory
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
{{- end }}
