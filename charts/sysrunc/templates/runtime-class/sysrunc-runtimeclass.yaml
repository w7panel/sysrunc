apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: sysrunc
  labels:
    {{- include "sysrunc.labels" . | nindent 4 }}
handler: sysrunc
{{- if .Values.compatRuntimeClasses }}
{{- fail "compatRuntimeClasses cannot be enabled while Sysrunc and Sysbox RuntimeClasses coexist; use the sysrunc RuntimeClass" }}
{{- end }}
