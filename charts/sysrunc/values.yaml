nodeSelector: {}
imagePullSecrets: []

# auto detects CKM's child panel agent; explicit host/nested overrides detection.
installMode: auto

runtimeClassName: sysrunc
# Enable after the old chart relinquishes ownership of its RuntimeClasses.

installer:
  enabled: true
  # host mode only: set cleanup for an explicit node-level rollback.
  action: install
  image:
    repository: ccr.ccs.tencentyun.com/afan-public/w7panel-sysrunc
    tag: ""
    pullPolicy: Always
  podLabels: {}
  podAnnotations: {}

admission:
  enabled: false
  replicas: 1
  containerdConfigPath: /var/lib/rancher/k3s/agent/etc/containerd
  podLabels: {}
  podAnnotations: {}

snapshotter:
  enabled: false
