apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sysrunc-l2-legacy-rootfs-1124
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: sysrunc-l2-legacy-rootfs-1124
  namespace: default
  annotations:
    sysbox/rootfs-rw-layer: '[{"name":"nginx","volumeName":"rootfs","path":"containers/legacy-1124","persistentSpecialMounts":true}]'
spec:
  runtimeClassName: sysrunc
  containers:
    - name: nginx
      image: ccr.ccs.tencentyun.com/afan-public/nginx:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
  volumes:
    - name: rootfs
      persistentVolumeClaim:
        claimName: sysrunc-l2-legacy-rootfs-1124
